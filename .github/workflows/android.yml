name: Android checks

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  pull_request:
    paths-ignore: ['**/*.md']

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '15859902' # 22.0, matching the local SDK manager
          packages: platform-tools
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Build app and instrumentation APKs
        run: bash ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease --console=plain
      - name: Test mapping retention
        run: python3 -m unittest discover -s scripts -p test_r8_artifacts.py -v
      - name: Export verified release mapping pair
        run: >-
          python3 scripts/r8_artifacts.py export --module app
          --apk app/build/outputs/apk/release/app-release-unsigned.apk
          --mapping app/build/outputs/mapping/release/mapping.txt
          --metadata app/build/outputs/apk/release/output-metadata.json
          --aapt2 "$ANDROID_HOME/build-tools/37.0.0/aapt2"
          --output release-archives
      - name: Preserve release APK and R8 mapping
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: r8-release-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: release-archives/*.zip
      - name: Run unit tests
        run: bash ./gradlew :app:testDebugUnitTest --console=plain
      - name: Run Android Lint
        run: bash ./gradlew :app:lintDebug --console=plain
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run API 21 core regression tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 21
          target: default
          arch: x86_64
          profile: Nexus 5
          emulator-build: '13823996' # 36.1.9, also verified locally on API 21
          script: bash ./gradlew :app:connectedDebugAndroidTest --console=plain
      - name: Preserve validation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-validation
          retention-days: 7
          path: |
            app/build/reports/
            app/build/outputs/androidTest-results/
